<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizar pedido — VOCE STORE</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#111111;
    --muted:#6b6b6e;
    --border:#e6e6e6;
    --panel:#f7f7f7;
    --accent:#dcab24;
    --accent-ink:#111111;
    --error:#b91c1c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }

  header{
    border-bottom:1px solid var(--border); padding:14px 18px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  header img{ height:44px; }
  header a.back{ font-size:13px; font-weight:700; color:var(--muted); text-decoration:none; }

  main{ max-width:640px; margin:0 auto; padding:24px 18px 80px 18px; }
  h1{ font-size:22px; font-weight:800; margin:0 0 4px 0; }
  .sub{ color:var(--muted); font-size:13.5px; margin:0 0 22px 0; }

  .box{
    border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:20px;
  }
  .box h2{ font-size:15px; font-weight:800; margin:0 0 12px 0; }

  .cart-line{
    display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);
    align-items:center; font-size:13.5px;
  }
  .cart-line:last-child{ border-bottom:none; }
  .cart-line img{ width:46px; height:58px; object-fit:cover; border-radius:6px; }
  .cl-info{ flex:1; }
  .cl-name{ font-weight:700; }
  .cl-meta{ color:var(--muted); font-size:12px; }
  .cl-qty{ color:var(--muted); font-size:12.5px; }

  .totals-row{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px; }
  .totals-row.grand{ font-weight:800; font-size:16.5px; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }

  .promo-hint{
    background:var(--panel); border-radius:8px; padding:10px 12px; font-size:12.5px;
    color:var(--ink); margin-top:10px;
  }

  label{ display:block; font-size:13px; font-weight:700; margin:14px 0 6px 0; }
  label.first{ margin-top:0; }
  input, select, textarea{
    width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; background:#fff; color:var(--ink); font-family:inherit;
  }
  textarea{ resize:vertical; min-height:70px; }
  .field-error{ color:var(--error); font-size:12px; margin-top:4px; display:none; }
  .field-error.show{ display:block; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media(max-width:480px){ .row2{ grid-template-columns:1fr; } }

  .submit-btn{
    width:100%; background:var(--ink); color:#fff; border:none; padding:15px;
    border-radius:10px; font-weight:800; font-size:15px; cursor:pointer; margin-top:22px;
  }
  .submit-btn:disabled{ background:#cfcfcf; color:#888; cursor:not-allowed; }
  .note-wa{ text-align:center; font-size:12px; color:var(--muted); margin-top:10px; }

  .empty-state{ text-align:center; padding:60px 0; color:var(--muted); }
  .empty-state a{ display:inline-block; margin-top:14px; background:var(--ink); color:#fff;
    padding:11px 20px; border-radius:8px; font-weight:700; font-size:13.5px; text-decoration:none; }

  .pay-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .pay-tab{
    flex:1; text-align:center; padding:10px; border:1px solid var(--border); border-radius:8px;
    font-weight:700; font-size:13.5px; cursor:pointer; background:#fff;
  }
  .pay-tab.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .pay-panel{ display:none; }
  .pay-panel.active{ display:block; }
  .qr-carousel{ display:flex; align-items:center; justify-content:center; gap:14px; margin:10px 0; }
  .qr-arrow{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:#fff;
    font-size:20px; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center;
  }
  .qr-big{ text-align:center; font-size:14px; font-weight:700; }
  .qr-big img{ width:230px; height:230px; object-fit:contain; border:1px solid var(--border); border-radius:14px; margin-bottom:8px; }
  .qr-dots{ display:flex; justify-content:center; gap:6px; margin-bottom:14px; }
  .qr-dot{ width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; }
  .qr-dot.active{ background:var(--ink); }
  .copy-row{ display:flex; gap:6px; margin-top:8px; align-items:center; }
  .copy-row input{ flex:1; background:var(--panel); font-weight:700; }
  .copy-btn{ padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:#fff; cursor:pointer; font-size:12.5px; font-weight:700; white-space:nowrap; }
  .copy-btn.copied{ background:#1f7a3f; color:#fff; border-color:#1f7a3f; }
  .titular-note{ font-size:12px; color:var(--muted); margin-top:4px; }
  .warn-box{
    background:#fff8e6; border:1px solid #f0d78c; border-radius:8px; padding:10px 12px;
    font-size:12.5px; color:#5c4a00; margin-top:12px;
  }
  .upload-box{
    border:1.5px dashed var(--border); border-radius:10px; padding:16px; text-align:center;
    margin-top:14px; cursor:pointer;
  }
  .upload-box img{ max-height:140px; margin:0 auto 8px auto; border-radius:8px; }
  .upload-box span{ font-size:13px; color:var(--muted); }

  .wa-float{ position:fixed; bottom:20px; left:20px; z-index:35; width:58px; height:58px; text-decoration:none; }
  .wa-float img{ width:100%; height:100%; display:block; filter:drop-shadow(0 4px 10px rgba(0,0,0,.3)); }
</style>
</head>
<body>

<header>
  <img src="logo-voce-store.png" alt="VOCE STORE">
  <a class="back" href="index.html">← Volver a la tienda</a>

<main>
  <div id="content"></div>

<a class="wa-float" href="https://wa.me/51965165095?text=Hola%20VOCE%20STORE%2C%20tengo%20una%20consulta" target="_blank" rel="noopener" aria-label="WhatsApp"><img src="whatsapp-icon.png" alt="WhatsApp"></a>

<script>
const WHATSAPP_NUMBER = "51965165095";
const BASICOS_PRICE = 43;
const BASICOS_PROMO_UNIT = 27.30;
const SHIPPING_FLAT = 9.90;
const FREE_SHIPPING_MIN = 150;

const DEPARTAMENTOS = {
  "Amazonas": ["Chachapoyas","Bagua","Bongará","Condorcanqui","Luya","Rodríguez de Mendoza","Utcubamba"],

  "Lambayeque": ["Chiclayo","Ferreñafe","Lambayeque"],
  "Lima": ["Lima (Metropolitana)","Barranca","Cajatambo","Canta","Cañete","Huaral","Huarochirí","Huaura","Oyón","Yauyos"],
  "Loreto": ["Maynas","Alto Amazonas","Loreto","Mariscal Ramón Castilla","Requena","Ucayali","Datem del Marañón","Putumayo"],

  "Moquegua": ["Mariscal Nieto","General Sánchez Cerro","Ilo"],
  "Pasco": ["Pasco","Daniel Alcides Carrión","Oxapampa"],
  "Piura": ["Piura","Ayabaca","Huancabamba","Morropón","Paita","Sullana","Talara","Sechura"],
  "Puno": ["Puno","Azángaro","Carabaya","Chucuito","El Collao","Huancané","Lampa","Melgar","Moho","San Antonio de Putina","San Román","Sandia","Yunguyo"],
  "San Martín": ["Moyobamba","Bellavista","El Dorado","Huallaga","Lamas","Mariscal Cáceres","Picota","Rioja","San Martín","Tocache"],
  "Tacna": ["Tacna","Candarave","Jorge Basadre","Tarata"],
  "Tumbes": ["Tumbes","Contralmirante Villar","Zarumilla"],
  "Ucayali": ["Coronel Portillo","Atalaya","Padre Abad","Purús"]
};

const BANCOS = {
  bcp: { nombre:"BCP", cuenta:"191-98192570-0-12", titular:"Roxana Arámbulo" },
  interbank: { nombre:"Interbank", cuenta:"898-3372407826", titular:"Roxana Arámbulo" },
  scotiabank: { nombre:"Scotiabank", cuenta:"825-3496197", titular:"Pierre Iturrizaga" },
};

let selectedPayMethod = { type:'yape' };
let capturaFileName = '';

const QR_OPTIONS = [
  { img:'qr-yape.jpg', label:'Yape' },
  { img:'qr-plin.jpg', label:'Plin' },
];
let qrIndex = 0;
function setQr(i){
  qrIndex = (i + QR_OPTIONS.length) % QR_OPTIONS.length;
  document.getElementById('qrBigImg').src = QR_OPTIONS[qrIndex].img;
  document.getElementById('qrBigLabel').textContent = QR_OPTIONS[qrIndex].label;
  document.querySelectorAll('.qr-dot').forEach((d,i) => d.classList.toggle('active', i === qrIndex));
}
function switchQr(delta){ setQr(qrIndex + delta); }

function money(n){ return "S/ " + n.toFixed(2); }

function switchPayTab(tab){
  document.querySelectorAll('.pay-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('panel-yape').classList.toggle('active', tab === 'yape');
  document.getElementById('panel-banco').classList.toggle('active', tab === 'banco');
  selectedPayMethod = tab === 'yape' ? { type:'yape' } : { type:'banco', banco: document.getElementById('f_banco').value };
}

function copyField(id, btn){
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.value.replace(/\s/g,'')).then(() => {
    const original = btn.textContent;
    btn.textContent = '¡Copiado!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1500);
  });
}

function previewCaptura(e){
  const file = e.target.files[0];
  if (!file) return;
  capturaFileName = file.name;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('capturaPreviewWrap').innerHTML = `
      <img src="${ev.target.result}" alt="Captura de pago">
      <span>✓ ${file.name} — toca para cambiarla</span>
    `;
  };
  reader.readAsDataURL(file);
}

function loadCart(){
  try{ return JSON.parse(localStorage.getItem('voce_cart') || '[]'); }
  catch(e){ return []; }
}
function clearCart(){ localStorage.removeItem('voce_cart'); }

function basicoLines(cart){ return cart.filter(l => l.type==='basico'); }
function packLines(cart){ return cart.filter(l => l.type==='pack'); }
function cartTotalQty(cart){ return cart.reduce((s,l)=>s+l.qty,0); }
function cartSubtotal(cart){
  const basicos = basicoLines(cart);
  const bqty = basicos.reduce((s,l)=>s+l.qty,0);
  const unit = bqty >= 3 ? BASICOS_PROMO_UNIT : BASICOS_PRICE;
  const basicosTotal = bqty * unit;
  const packsTotal = packLines(cart).reduce((s,l)=>s + l.precio*l.qty, 0);
  return basicosTotal + packsTotal;
}

function renderEmpty(){
  document.getElementById('content').innerHTML = `
    <div class="empty-state">
      Tu carrito está vacío.<br>Agrega algún producto antes de continuar.
      <br><a href="index.html">Volver a la tienda</a>
    </div>
  `;
}

function renderCheckout(cart){
  const subtotal = cartSubtotal(cart);
  const shipping = subtotal >= FREE_SHIPPING_MIN ? 0 : SHIPPING_FLAT;
  const total = subtotal + shipping;
  const faltaParaEnvio = FREE_SHIPPING_MIN - subtotal;

  const linesHtml = cart.map(l => {
    if (l.type === 'basico'){
      return `
        <div class="cart-line">
          <img src="basico-${l.colorSlug}-1.jpg" alt="${l.colorNombre}">
          <div class="cl-info">
            <div class="cl-name">Básico ${l.colorNombre}</div>
            <div class="cl-meta">Talla ${l.talla}</div>
          </div>
          <div class="cl-qty">x${l.qty}</div>
        </div>
      `;
    }
    return `
      <div class="cart-line">
        <img src="${l.img}" alt="Pack ${l.n}">
        <div class="cl-info">
          <div class="cl-name">Pack ${l.n} personalizados</div>
          <div class="cl-meta">${money(l.precio)} c/u</div>
        </div>
        <div class="cl-qty">x${l.qty}</div>
      </div>
    `;
  }).join('');

  const deptOptions = Object.keys(DEPARTAMENTOS).sort().map(d => `<option value="${d}">${d}</option>`).join('');

  document.getElementById('content').innerHTML = `
    <h1>Finalizar pedido</h1>
    <p class="sub">Revisa tu pedido y completa tus datos — lo enviamos directo a nuestro WhatsApp para coordinar el pago y el envío.</p>

    <div class="box">
      <h2>Tu pedido</h2>
      ${linesHtml}
      <div class="totals-row" style="margin-top:10px;"><span>Subtotal</span><span>${money(subtotal)}</span></div>
      <div class="totals-row"><span>Envío</span><span>${shipping===0 ? 'GRATIS' : money(shipping)}</span></div>
      <div class="totals-row grand"><span>Total</span><span>${money(total)}</span></div>
      ${faltaParaEnvio > 0 ? `<div class="promo-hint">Te faltan <b>${money(faltaParaEnvio)}</b> en tu pedido para envío gratis.</div>` : ''}
    </div>

    <div class="box">
      <h2>Método de pago</h2>
      <div class="pay-tabs">
        <div class="pay-tab active" data-tab="yape" onclick="switchPayTab('yape')">Yape / Plin</div>
        <div class="pay-tab" data-tab="banco" onclick="switchPayTab('banco')">Transferencia bancaria</div>
      </div>

      <div class="pay-panel active" id="panel-yape">
        <div class="qr-carousel">
          <button type="button" class="qr-arrow" onclick="switchQr(-1)">‹</button>
          <div class="qr-big">
            <img id="qrBigImg" src="qr-yape.jpg" alt="QR Yape">
            <div id="qrBigLabel">Yape</div>
          </div>
          <button type="button" class="qr-arrow" onclick="switchQr(1)">›</button>
        </div>
        <div class="qr-dots">
          <span class="qr-dot active" data-i="0" onclick="setQr(0)"></span>
          <span class="qr-dot" data-i="1" onclick="setQr(1)"></span>
        </div>
        <div class="copy-row">
          <input type="text" id="numYapePlin" value="954 106 866" readonly>
          <button type="button" class="copy-btn" onclick="copyField('numYapePlin', this)">Copiar</button>
        </div>
        <div class="titular-note">Titular: Roxana Arámbulo</div>
      </div>

      <div class="pay-panel" id="panel-banco">
        <label class="first">Selecciona el banco</label>
        <select id="f_banco">
          <option value="">Selecciona...</option>
          <option value="bcp">BCP</option>
          <option value="interbank">Interbank</option>
          <option value="scotiabank">Scotiabank</option>
        </select>
        <div id="bancoInfo"></div>
        <div class="warn-box">Si vas a transferir desde <b>otro banco</b>, es posible que te pidan el código CCI en vez del número de cuenta — aún no lo tenemos cargado aquí. Si es tu caso, avísanos por WhatsApp y te lo pasamos directo.</div>
      </div>

      <div class="upload-box" onclick="document.getElementById('f_captura').click()">
        <input type="file" id="f_captura" accept="image/*" style="display:none" onchange="previewCaptura(event)">
        <div id="capturaPreviewWrap"><span>📎 Toca para seleccionar tu captura de pago</span></div>
      </div>
      <div class="field-error" id="e_captura">Selecciona tu captura de pago.</div>
    </div>

    <div class="box">
      <h2>Tus datos</h2>
      <form id="checkoutForm" novalidate>
        <label class="first">Nombre completo</label>
        <input type="text" id="f_nombre" required>
        <div class="field-error" id="e_nombre">Ingresa tu nombre completo.</div>

        <label>Celular / WhatsApp de contacto</label>
        <input type="tel" id="f_celular" inputmode="numeric" placeholder="9XXXXXXXX" required>
        <div class="field-error" id="e_celular">Ingresa un celular válido (9 dígitos).</div>

        <div class="row2">
          <div>
            <label>Departamento</label>
            <select id="f_departamento" required>
              <option value="" disabled selected>Selecciona...</option>
              ${deptOptions}
            </select>
            <div class="field-error" id="e_departamento">Selecciona un departamento.</div>
          </div>
          <div>
            <label>Provincia</label>
            <select id="f_provincia" required disabled>
              <option value="" disabled selected>Elige un departamento primero</option>
            </select>
            <div class="field-error" id="e_provincia">Selecciona una provincia.</div>
          </div>
        </div>

        <label>Distrito</label>
        <input type="text" id="f_distrito" placeholder="Ej: Miraflores" required>
        <div class="field-error" id="e_distrito">Ingresa tu distrito.</div>

        <label>Dirección exacta (calle, número, referencia)</label>
        <textarea id="f_direccion" placeholder="Av. Ejemplo 123, dpto 4B, cerca al parque..." required></textarea>
        <div class="field-error" id="e_direccion">Ingresa tu dirección completa.</div>

        <label>Comentario adicional (opcional)</label>
        <textarea id="f_comentario" placeholder="Referencias, horario de entrega, etc."></textarea>

        <button type="submit" class="submit-btn">CONFIRMAR PEDIDO</button>
        <div class="note-wa">Se te redirigirá a WhatsApp con todo ya redactado.</div>
      </form>
    </div>
  `;

  const bancoSelect = document.getElementById('f_banco');
  bancoSelect.addEventListener('change', () => {
    const b = BANCOS[bancoSelect.value];
    selectedPayMethod = { type:'banco', banco: bancoSelect.value };
    if (!b){ document.getElementById('bancoInfo').innerHTML = ''; return; }
    document.getElementById('bancoInfo').innerHTML = `
      <label>Número de cuenta</label>
      <div class="copy-row">
        <input type="text" id="numCuenta" value="${b.cuenta}" readonly>
        <button type="button" class="copy-btn" onclick="copyField('numCuenta', this)">Copiar</button>
      </div>
      <div class="titular-note">Titular: ${b.titular}</div>
    `;
  });

  const deptSelect = document.getElementById('f_departamento');
  const provSelect = document.getElementById('f_provincia');
  deptSelect.addEventListener('change', () => {
    const provincias = DEPARTAMENTOS[deptSelect.value] || [];
    provSelect.innerHTML = '<option value="" disabled selected>Selecciona...</option>' +
      provincias.map(p => `<option value="${p}">${p}</option>`).join('');
    provSelect.disabled = false;
  });

  document.getElementById('checkoutForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!validate()) return;
    sendToWhatsapp(cart, subtotal, shipping, total);
  });
}

function validate(){
  let ok = true;
  const checks = [
    ['f_nombre','e_nombre', v => v.trim().length >= 3],
    ['f_celular','e_celular', v => /^9\d{8}$/.test(v.trim())],
    ['f_departamento','e_departamento', v => v !== ''],
    ['f_provincia','e_provincia', v => v !== ''],
    ['f_distrito','e_distrito', v => v.trim().length >= 2],
    ['f_direccion','e_direccion', v => v.trim().length >= 6],
  ];
  const capturaOk = capturaFileName !== '';
  document.getElementById('e_captura').classList.toggle('show', !capturaOk);
  if (!capturaOk) ok = false;
  if (selectedPayMethod.type === 'banco' && !selectedPayMethod.banco){
    ok = false;
  }
  checks.forEach(([fieldId, errId, fn]) => {
    const el = document.getElementById(fieldId);
    const errEl = document.getElementById(errId);
    if (!fn(el.value)){
      errEl.classList.add('show');
      ok = false;
    } else {
      errEl.classList.remove('show');
    }
  });
  return ok;
}

function sendToWhatsapp(cart, subtotal, shipping, total){
  const nombre = document.getElementById('f_nombre').value.trim();
  const celular = document.getElementById('f_celular').value.trim();
  const depto = document.getElementById('f_departamento').value;
  const prov = document.getElementById('f_provincia').value;
  const distrito = document.getElementById('f_distrito').value.trim();
  const direccion = document.getElementById('f_direccion').value.trim();
  const comentario = document.getElementById('f_comentario').value.trim();

  const lines = cart.map(l => {
    if (l.type === 'basico') return `- Básico ${l.colorNombre}, Talla ${l.talla} x${l.qty}`;
    return `- Pack ${l.n} personalizados (${money(l.precio)} c/u) x${l.qty}`;
  }).join('\n');

  let pagoTexto = '';
  if (selectedPayMethod.type === 'yape') pagoTexto = 'Yape / Plin';
  else if (selectedPayMethod.type === 'banco') pagoTexto = 'Transferencia ' + (BANCOS[selectedPayMethod.banco]?.nombre || '');

  const msg = [
    `Hola VOCE STORE, quiero confirmar mi pedido:`,
    ``,
    lines,
    ``,
    `Subtotal: ${money(subtotal)}`,
    `Envío: ${shipping===0 ? 'GRATIS' : money(shipping)}`,
    `Total: ${money(total)}`,
    ``,
    `Datos de entrega:`,
    `Nombre: ${nombre}`,
    `Celular: ${celular}`,
    `Departamento: ${depto}`,
    `Provincia: ${prov}`,
    `Distrito: ${distrito}`,
    `Dirección: ${direccion}`,
    comentario ? `Comentario: ${comentario}` : ``,
    ``,
    `Pago realizado por: ${pagoTexto}`,
    `Comprobante de pago: Archivo adjunto ✅`,
  ].filter(Boolean).join('\n');

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  clearCart();
  window.location.href = url;
}

const cart = loadCart();
if (!cart.length) renderEmpty();
else renderCheckout(cart);
</script>
</body>
</html>
