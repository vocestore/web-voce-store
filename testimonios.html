<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonios — VOCE STORE</title>
<style>
  :root{
    --bg:#ffffff; --ink:#111111; --muted:#6b6b6e; --border:#e6e6e6; --panel:#f7f7f7; --accent:#dcab24;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header{ border-bottom:1px solid var(--border); padding:14px 18px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  header img{ height:56px; }
  header a.back{ font-size:13px; font-weight:700; color:var(--muted); text-decoration:none; }
  main{ max-width:760px; margin:0 auto; padding:30px 18px 80px 18px; }
  h1{ font-size:26px; font-weight:800; margin:0 0 6px 0; text-align:center; }
  .sub{ color:var(--muted); font-size:14px; margin:0 0 30px 0; text-align:center; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:600px){ .grid{ grid-template-columns:1fr; } }
  .card{ border:1px solid var(--border); border-radius:12px; padding:18px; }
  .stars{ color:var(--accent); font-size:14px; margin-bottom:8px; }
  .quote{ font-size:14px; line-height:1.6; color:#2a2a2a; margin:0 0 14px 0; }
  .who{ display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; }
  .who .name{ font-weight:800; }
  .who .date{ color:var(--muted); }
  .state{ text-align:center; color:var(--muted); padding:60px 0; font-size:14px; }
  a{ color:var(--ink); }
</style>
</head>
<body>

<header>
  <a href="index.html"><img src="logo-voce-store.png" alt="VOCE STORE"></a>
  <a class="back" href="index.html">← Volver a la tienda</a>
</header>

<main>
  <h1>Lo que dicen nuestros clientes</h1>
  <p class="sub">Opiniones reales de personas que ya compraron en VOCE STORE.</p>
  <div id="content"><div class="state">Cargando testimonios...</div></div>
</main>

<script>
const SHEET_ID = "1uoEz-3Gj8rV6esD0lbH3jSATYrWOfq_j8oT7UfkRD0c";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i=0; i<text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field=''; }
      else if (c === '\r'){ /* skip */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
}

function parseFechaHora(s){
  // formato esperado: D/M/AAAA H:MM:SS
  const [datePart] = s.trim().split(' ');
  const [d, m, y] = datePart.split('/').map(Number);
  if (!d || !m || !y) return null;
  return new Date(y, m-1, d);
}

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function formatFecha(dateObj){
  if (!dateObj) return '';
  return `${dateObj.getDate()} ${MESES[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
}

async function loadTestimonios(){
  const content = document.getElementById('content');
  try{
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    const rows = parseCSV(text);
    if (!rows.length) throw new Error('empty');

    const headers = rows[0].map(h => h.trim());
    const idxFecha = headers.findIndex(h => h.toLowerCase().includes('marca temporal'));
    const idxNombre = headers.findIndex(h => h.toLowerCase().includes('tu nombre'));
    const idxMotivo = headers.findIndex(h => h.toLowerCase().includes('podrias indicarnos la razón') || h.toLowerCase().includes('podrías indicarnos la razón'));

    const items = [];
    for (let i=1; i<rows.length; i++){
      const r = rows[i];
      const nombre = (r[idxNombre] || '').trim();
      const motivo = (r[idxMotivo] || '').trim();
      const fechaStr = (r[idxFecha] || '').trim();
      if (!nombre || !motivo) continue;
      items.push({ nombre, motivo, fecha: parseFechaHora(fechaStr) });
    }

    items.sort((a,b) => (b.fecha?.getTime()||0) - (a.fecha?.getTime()||0));

    if (!items.length){
      content.innerHTML = '<div class="state">Todavía no hay testimonios para mostrar.</div>';
      return;
    }

    content.innerHTML = `<div class="grid">` + items.map(it => `
      <div class="card">
        <div class="stars">★★★★★</div>
        <p class="quote">"${it.motivo.replace(/</g,'&lt;')}"</p>
        <div class="who">
          <span class="name">${it.nombre.replace(/</g,'&lt;')}</span>
          <span class="date">${formatFecha(it.fecha)}</span>
        </div>
      </div>
    `).join('') + `</div>`;
  } catch(err){
    content.innerHTML = '<div class="state">No pudimos cargar los testimonios en este momento. Intenta de nuevo más tarde.</div>';
  }
}

loadTestimonios();
</script>
</body>
</html>
